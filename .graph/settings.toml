repository = "bmo-cache-siren"
base = false

[coverage]
# Every Cargo package's src/ and the TypeScript client package, but these: the crate root, which only lists
# its modules and re-exports, and the types generated from the OpenAPI document.
layout = "bmo-next"
roots = ["package/"]
unindexed = ["src/lib.rs", "package/openapi.d.ts"]
