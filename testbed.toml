# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.
testbed = 0
name = "bmo-cache-siren"

# The Cargo package's tests are under tests/. The TypeScript client in `package/` is a project of its own,
# found by its manifest and its lockfile, and checked and tested by its manifest's `check` script.
[test]
languages = ["cargo", "bun"]
setup = ["bun install --frozen-lockfile --cwd package"]

[check]
quick = ["korean", "layout", "dependencies", "cargo-profile", "shared-versions"]
# No file of the checkout holds Korean, so the ledger allows none anywhere.
korean_ledger = "korean-ledger.json"
# The siren builds on no other repository's library: every crate it names comes from the registry.
base_libraries = []

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

[check.shared_versions.exceptions.reqwest]
reason = "The service's Rust client makes one blocking call per route, which reqwest's blocking feature serves; the shared line has no blocking client."
line = 'reqwest = { version = "0.13.5", features = ["blocking", "json", "query", "stream"] }'

[[check.step]]
id = "check"
command = "cargo check --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --check"

# The one binary serves the API, runs the command's verbs, starts the MCP server and prints the OpenAPI
# document.
[build]
binaries = ["bmo-cache-siren"]

# The daemon runs from its own deploy tree: a release is a worktree of the commit, so the pages in web/
# stand beside bin/bmo-cache-siren, which finds them there. Its config file lives in the data root and is
# kept across releases; `PATCH /settings` writes back into it. The unit is restarted by every deployment,
# so a release's pages and binary go live together.
[deploy]
root = "~/.local/share/bmo-cache-siren"
data_root = "~/.local/share/bmo-cache-siren/data"
units = ["deploy/systemd/*.service"]

[[deploy.step]]
id = "data-root"
phase = "before-flip"
command = "mkdir -p \"$HOME/.local/share/bmo-cache-siren/data\""
