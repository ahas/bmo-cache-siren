# The siren is one package: the library holds the daemon's parts, its client and its MCP server, and the
# binary runs them. Every test lives in `tests/`. Versions follow the ones the bmo services already
# build with, so one cargo cache serves them all; nothing here reaches another repository.
[package]
name = "bmo-cache-siren"
description = "Live watch of prompt-cache hits and new tokens per request, with a siren on sudden re-prefills"
version = "0.1.0-rev.3"
edition = "2024"
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[lib]
name = "cache_siren"
path = "src/lib.rs"

[[bin]]
name = "bmo-cache-siren"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
# A new bearer token's random bytes.
getrandom = "0.4.3"
glob = "0.3.4"
hound = "3.5.1"
indexmap = { version = "2.14.2", features = ["serde"] }
# The client's calls to the service.
reqwest = { version = "0.13.5", features = ["blocking", "json", "query", "stream"] }
# The harness plugin's MCP server, on standard input and output.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
# The JSON Schemas of the wire types, for the OpenAPI document and the tools.
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }

[dev-dependencies]
# The patterns the repository-wide personal-data check reads every tracked file with (tests/personal_data.rs).
regex = "1.13.1"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[[test]]
name = "main"
path = "tests/main.rs"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
