<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>cache-siren</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0d1117;--fg:#d5dbe3;--dim:#7d8590;--line:#22272e;--warm:#2ea043;--yellow:#d29922;--red:#f85149;--blue:#58a6ff;--purple:#bc8cff;--mono:"SF Mono",Menlo,monospace}
html,body{margin:0;background:var(--bg);color:var(--fg);font:11.5px/1.35 var(--mono);height:100%;overflow:hidden;-webkit-user-select:none}
body.alarm{animation:flash .5s ease-in-out 5}
@keyframes flash{0%,100%{background:var(--bg)}50%{background:#5a1a1a}}
#hdr{display:flex;align-items:center;gap:10px;padding:5px 8px;border-bottom:1px solid var(--line);background:#161b22;position:sticky;top:0;-webkit-app-region:drag}
#hdr .t{font-weight:700;color:#fff;letter-spacing:.5px}
#hdr .q{color:var(--fg)}#hdr .q b{font-size:13px}
#hdr .q.warn b{color:var(--yellow)}#hdr .q.bad b{color:var(--red)}
#spark{display:flex;align-items:flex-end;gap:1px;height:16px}
#spark i{display:block;width:5px;background:var(--blue);min-height:1px;border-radius:1px}
#spark i.y{background:var(--yellow)}#spark i.r{background:var(--red)}
#hdr .sp{flex:1}
#hdr button{background:#21262d;color:var(--fg);border:1px solid #30363d;border-radius:4px;font:inherit;padding:1px 6px;cursor:pointer}
#hdr button.on{background:#264f78;border-color:var(--blue)}
#hdr button.mute{padding:1px 4px;line-height:0}
#hdr button.mute img{height:16px;width:16px;vertical-align:middle;display:block}
#hdr button.mute span{line-height:1.35}
#hdr button.mute.on{background:#3a1414;border-color:var(--red)}
#list{overflow-y:auto;height:calc(100% - 30px)}
.row{display:grid;grid-template-columns:58px 118px 66px 62px 70px 62px 1fr;gap:6px;padding:2px 8px;border-bottom:1px solid #161b22;white-space:nowrap;overflow:hidden;cursor:default}
.row:hover{background:#161b22}
.row .ts{color:var(--dim)}.row .sess{color:var(--fg);overflow:hidden;text-overflow:ellipsis}.row .sess .sid{color:var(--dim)}.row .sess .ag{color:var(--purple)}
.row .m{color:var(--blue)}
.row .k{font-weight:700;text-align:center;border-radius:3px;padding:0 3px}
.k.warm{color:var(--warm)}.k.growth{color:var(--yellow)}.k.start{color:var(--blue)}.k.cold{color:#fff;background:var(--red)}.k.refusal{color:#fff;background:#a371f7}.k.quota{color:#fff;background:var(--yellow)}.k.error{color:var(--red)}.k.cmd,.k.compact,.k.notice{color:var(--dim)}.k.burst{color:#fff;background:var(--red)}
.row .new{text-align:right}.row .new.y{color:var(--yellow)}.row .new.r{color:var(--red);font-weight:700}
.row .rd{text-align:right;color:var(--dim)}
.row .req{color:var(--dim);overflow:hidden;text-overflow:ellipsis}.row .req .note{color:var(--fg);margin-right:6px}
.row.local{opacity:.45}
.row.lv-red{background:#2b0f0f}.row.lv-yellow{background:#2a2410}
.row.new-in{animation:pop .6s}
@keyframes pop{from{background:#264f78}to{}}
.det{grid-column:1/-1;white-space:pre-wrap;color:var(--dim);font-size:10.5px;padding:2px 0 4px 58px}
/* In a narrow window the six fixed columns are wider than the window and squeeze the content
   column (1fr) to nothing. Then the time goes up to its own line and the rest stands below it,
   so the content uses the full width of the window. */
@media (max-width: 640px){
  .row{grid-template-columns:118px 66px 62px 70px 1fr;}
  .row .ts{grid-column:1/-1}
  .row .req{grid-column:1/-1;white-space:normal}
  .row .rd{display:none}
  .det{padding-left:0}
}
#empty{padding:20px;color:var(--dim);text-align:center}
</style></head><body>
<div id="hdr">
  <span class="t">cache-siren</span>
  <span class="q" id="rate">60s <b>0</b></span>
  <span id="spark"></span>
  <span class="q" id="sess"><b>0</b> sess</span>
  <span class="sp"></span>
  <button id="bLocal" title="show local sessions">local</button>
  <button id="bMute" class="mute" title="siren and voice on/off"><img id="muteImg" src="/asset/siren_on.png" alt="siren"><span id="muteGlyph" hidden>siren</span></button>
  <button id="bHide" title="hide (back with bmo-cache-siren restart)">—</button>
</div>
<div id="list"><div id="empty">waiting for events…</div></div>
<script>
// The API takes the token the address's fragment carries (bmo-cache-siren page prints it); the tab keeps it,
// and the address bar lets go of it.
const $=s=>document.querySelector(s);
const TOKEN_KEY='cache-siren-token', LOCAL_KEY='cache-siren-local';
const given=new URLSearchParams(location.hash.slice(1)).get('access_token');
if(given){sessionStorage.setItem(TOKEN_KEY,given);history.replaceState(null,'',location.pathname);}
const TOKEN=sessionStorage.getItem(TOKEN_KEY)||'';
const list=$('#list'); const rows=new Map(); let held=[];
let showLocal=localStorage.getItem(LOCAL_KEY)==='1', armed=true, threshold=100000, lastId=0, es=null, images=true;
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1000?(n/1000).toFixed(n>=100000?0:1)+'K':String(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock=at=>new Date(at).toTimeString().slice(0,8);
function api(path,options={}){
  const headers={'Authorization':'Bearer '+TOKEN,'Accept':'application/json','Content-Type':'application/json'};
  return fetch(path,{...options,headers}).then(r=>r.ok?r.json():Promise.reject(new Error(String(r.status))));
}
function muteFace(){
  $('#bMute').classList.toggle('on',!armed);
  $('#muteGlyph').textContent=armed?'siren':'quiet';
  $('#muteImg').hidden=!images; $('#muteGlyph').hidden=images;
  if(images)$('#muteImg').src=armed?'/asset/siren_on.png':'/asset/siren_off.png';
}
$('#muteImg').onerror=()=>{images=false;muteFace();};
function applySettings(s){armed=s.armed;threshold=s.threshold;muteFace();}
function applyLocal(){$('#bLocal').classList.toggle('on',showLocal);
  for(const el of rows.values()){el.style.display=(el.classList.contains('local')&&!showLocal)?'none':'';}}
$('#bMute').onclick=()=>api('/settings',{method:'PATCH',body:JSON.stringify({armed:!armed})}).then(applySettings).catch(()=>{});
$('#bLocal').onclick=()=>{showLocal=!showLocal;localStorage.setItem(LOCAL_KEY,showLocal?'1':'0');applyLocal();};
$('#bHide').onclick=()=>{try{window.webkit.messageHandlers.overlay.postMessage('hide')}catch(e){}};
function add(id,el,local){
  el.className+=(local?' local':'')+' new-in'; el.dataset.id=id;
  if(local&&!showLocal)el.style.display='none';
  rows.set(id,el); $('#empty')?.remove(); list.insertBefore(el,list.firstChild);
  while(list.children.length>150){const last=list.lastChild; rows.delete(+last.dataset.id); last.remove();}
}
function usageRow(id,u){
  const el=document.createElement('div'); el.className='row lv-'+u.level;
  const lvl=u.level==='red'?'r':u.level==='yellow'?'y':'';
  const sess=`${esc(u.projectName)}${u.subagent?'<span class="ag"> ⤷agent</span>':''} <span class="sid">${esc(u.sessionId.slice(0,8))}</span>`;
  el.innerHTML=`<span class="ts">${clock(u.at)}</span><span class="sess" title="${esc(u.sessionId)}">${sess}</span><span class="m">${esc(u.modelLabel)}</span>`+
    `<span class="k ${u.kind}">${u.kind}</span><span class="new ${lvl}">${u.newTokenCount?'+'+fmt(u.newTokenCount):''}</span><span class="rd">${u.cachedTokenCount?fmt(u.cachedTokenCount):''}</span>`+
    `<span class="req">${u.note?'<span class="note">'+esc(u.note)+'</span>':''}${esc(u.requestLabel)}</span>`;
  el.onclick=()=>{const d=el.querySelector('.det'); if(d){d.remove();return;} const x=document.createElement('div');x.className='det';
    const billed=u.backend==='local'?' · local (not billed)':u.costUsd?` · ≈$${u.costUsd}`:'';
    const gap=u.gapMs==null?'-':Math.round(u.gapMs/1000);
    x.textContent=`session ${u.sessionId} dir ${u.directoryName} harness ${u.harnessName} model ${u.modelName} input ${u.inputTokenCount} cache_write ${u.cacheWriteTokenCount} cache_read ${u.cachedTokenCount} out ${u.outputTokenCount} ctx ${u.contextTokenCount} prev_ctx ${u.previousContextTokenCount} gap ${gap}s${billed}`;
    el.appendChild(x);};
  add(id,el,u.backend==='local');
}
function burstRow(id,s){
  const el=document.createElement('div'); el.className='row lv-red';
  el.innerHTML=`<span class="ts">${clock(s.at)}</span><span class="sess" title="${esc(s.parts.map(p=>p.projectName+' '+fmt(p.newTokenCount)).join(', '))}">${esc(s.projectName)}</span><span class="m"></span>`+
    `<span class="k burst">burst</span><span class="new r">+${fmt(s.newTokenCount)}</span><span class="rd">${s.cachedTokenCount?fmt(s.cachedTokenCount):''}</span>`+
    `<span class="req"><span class="note">${esc(s.note)}</span></span>`;
  add(id,el,false);
}
function alarm(){document.body.classList.remove('alarm');void document.body.offsetWidth;document.body.classList.add('alarm');}
function handle(event,live){
  // Events come oldest first, and a page read again holds the ones already shown.
  if(event.id<=lastId)return; lastId=event.id;
  if(event.kind==='usage.created'){usageRow(event.id,event.data);held.push(event.data);}
  else if(event.kind==='siren.sounded'){if(event.data.kind==='burst')burstRow(event.id,event.data); if(live)alarm();}
  else if(event.kind==='settings.changed'){applySettings(event.data);}
}
// The header is summed from the Usages held: new tokens per minute over ten minutes, the last minute's, and
// the sessions of the last half hour; local rows bill nothing and are left out.
function header(){
  const now=Date.now(); held=held.filter(u=>now-u.at<1800000);
  const billed=held.filter(u=>u.backend!=='local'), perMin=new Array(10).fill(0); let last=0; const live=new Set();
  for(const u of billed){const age=now-u.at; live.add(u.sessionId);
    if(u.newTokenCount&&age>=0&&age<600000)perMin[9-Math.floor(age/60000)]+=u.newTokenCount;
    if(u.newTokenCount&&age<60000)last+=u.newTokenCount;}
  $('#rate').innerHTML=`60s <b>${fmt(last)}</b>`; $('#sess').innerHTML=`<b>${live.size}</b> sess`;
  const sp=$('#spark'); sp.innerHTML=''; const mx=Math.max(1,...perMin);
  perMin.forEach(v=>{const i=document.createElement('i');i.style.height=Math.max(1,Math.round(15*v/mx))+'px';i.title=fmt(v);
    if(v>=threshold*3)i.className='r';else if(v>=threshold)i.className='y';sp.appendChild(i);});
}
async function boot(){
  if(es){es.close();es=null;}
  if(!TOKEN){$('#empty').textContent='open the address bmo-cache-siren page prints';return;}
  try{applySettings(await api('/settings'));}catch(e){}
  try{const page=await api('/events?limit=300'); page.items.forEach(event=>handle(event,false));}catch(e){setTimeout(boot,2000);return;}
  applyLocal(); header(); connect();
}
function connect(){
  es=new EventSource('/events?after='+lastId+'&access_token='+encodeURIComponent(TOKEN));
  for(const kind of ['usage.created','siren.sounded','settings.changed'])es.addEventListener(kind,m=>handle(JSON.parse(m.data),true));
  // A stream that broke may have missed events past the window, so the page is read again before it resumes.
  es.onerror=()=>{es.close();es=null;setTimeout(boot,2000);};
}
setInterval(header,2000);
boot();
</script></body></html>
